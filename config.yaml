# ============================================================
# Job Bot Configuration — EXAMPLE
# Edit the keywords, locations, companies, and applicant info
# below to match your own job search, then keep this file
# (with your real details) in a PRIVATE repo only.
# ============================================================

# ------------------------------------------------------------
# SEARCH TERMS
# ------------------------------------------------------------
# Jobs must match at least one keyword in the JOB TITLE.
#
# Broad enough to maximize reach, but focused enough to avoid
# wasting applications on unrelated junior/QA/mobile roles.
# ------------------------------------------------------------
 
keywords:
  # 1. General Software Engineering & SDE
  - "Software Development Intern"
  - "Software Intern"
  - "SDE Intern"
  - "Software Engineer Intern"
  - "Software Engineer Trainee"
  - "Software Trainee"
  - "SDE Trainee"
  - "Graduate Engineer Trainee" 
  - "GET"
  
  # 2. Full Stack & Backend
  - "Full Stack Intern"
  - "Full Stack Trainee"
  - "Backend Intern"
  - "Backend Trainee"
  - "API Developer Trainee"
  - "Node.js Trainee"
  - "Python Trainee"
  - "Node.js Developer Intern"
  - "Python Developer Intern"
  - "API Developer Intern"
  
   # 3. AI / GenAI / LLM
  - "AI Intern"
  - "AI Engineer Intern"
  - "AI Trainee"
  - "GenAI Intern"
  - "LLM Intern"
  - "GenAI Trainee"
  - "LLM Trainee"
  - "Machine Learning Intern"
  - "ML Intern"
  - "Applied AI Intern"
  - "RAG Intern"
  - "Machine Learning Trainee"
  - "ML Trainee"
  - "Applied AI Trainee"
  - "RAG Trainee"
  
  # 4. Forward Deployed / Solutions
  - "Forward Deployed Engineer Intern"
  - "FDE Intern"
  - "Solutions Engineer Intern"
  - "Customer Engineer Intern"
  - "FDE Trainee"
  - "Solutions Engineer Trainee"
  - "Customer Engineer Trainee"
  
  # 5. DevOps & Cloud
  - "DevOps Intern"
  - "DevOps Trainee"
  - "Infrastructure Intern"
  - "Platform Intern"
  - "Cloud Intern"
  - "Cloud Trainee"
  - "Infrastructure Trainee"
  - "Platform Trainee"

