# ------------------------------------------------------------
# Example: exclude junior/QA/mobile-only roles, but keep senior
# levels in since this example config targets senior IC roles.
# ------------------------------------------------------------
exclude_keywords:
   # Prevent Non Tech
  - "Sales Trainee"
  - "Marketing Trainee"
  - "HR Trainee"
  - "Finance Trainee"
  - "Business Development Trainee"
  - "Management Trainee"
  - "Sales Intern"
  - "Marketing Intern"
  - "HR Intern"
  - "Finance Intern"
  - "Business Development Intern"
  - "Management Intern"
  # 1. Seniority (You are a student)
  - "Senior"
  - "Staff"
  - "Principal"
  - "Director"
  - "Vice President"
  - "VP"
  - "Chief"
  - "CTO"
  - "Head of"
  - "Lead"
  - "Manager"
  - "Full Time"
  - "Full-Time"
  - "Permanent"
  - "Regular"
  - "Experienced"
  - "Mid-Level"
  - "Mid Level"
  
  # 2. Non-Tech Roles (Unless it's Sales Engineering)
  - "Sales Executive"
  - "Marketing"
  - "Human Resources"
  - "HR"
  - "Recruiter"
  - "Finance"
  - "Business Development"

